# Throwaway local infrastructure for developing and testing Pulseboard (and the store integration)
# WITHOUT touching the real Aiven Kafka or MongoDB Atlas. Not used in production.
#
#   docker compose -f docker-compose.local.yml up -d --wait
#   docker compose -f docker-compose.local.yml down -v      # stop and delete all local data
#
# Everything binds to 127.0.0.1 only. Ports are chosen to avoid the usual suspects
# (store MongoDB 27017, store API 3000, store client 8080, Pulseboard dev 3000):
#   Kafka  localhost:9094   (plaintext; Pulseboard accepts this only with KAFKA_SSL=false on localhost)
#   Mongo  localhost:27018  (single-node replica set "rs0": Pulseboard's consumers need transactions)
name: pulseboard-local

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: pulseboard-local-kafka
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # Containers use kafka:9092; programs on this machine use localhost:9094.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # One-shot: creates the topic with the partition count Pulseboard expects (see TOPIC_PARTITIONS).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: pulseboard-local-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic website-events --partitions 2 --replication-factor 1

  mongo:
    image: mongo:7
    container_name: pulseboard-local-mongo
    command: ["mongod", "--replSet", "rs0", "--port", "27018", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27018"
    healthcheck:
      # Initiates the single-node replica set on first start, then reports healthy once it is PRIMARY.
      test:
        - CMD-SHELL
        - >-
          mongosh --port 27018 --quiet --eval
          "try { if (rs.status().myState === 1) quit(0); quit(1) }
          catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }); quit(1) }"
      interval: 4s
      timeout: 10s
      retries: 30
      start_period: 5s
